<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ピタッとビート</title>
<meta name="description" content="おとに あわせて ピタッ！ 小学生から遊べるリズムゲーム">
<meta name="theme-color" content="#3db6ff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+1p:wght@500;800&display=swap" rel="stylesheet">
<style>
/* 見た目: 青空 × 白いカード × 太いふちどり（ポップ） */
:root{
  --sky:#3db6ff; --ink:#1f2a44; --paper:#ffffff; --cream:#fff6dc; --sub:#5b6785;
  --sun:#ffd23f; --pink:#ff5c8a; --mint:#22c97f; --blue:#3d8bff; --orange:#ff8a3d;
  --gold:#ffc61a; --cyan:#19b8e6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--sky);color:var(--ink);overflow:hidden;
  font-family:"M PLUS 1p",system-ui,sans-serif;font-weight:500;user-select:none;-webkit-user-select:none;touch-action:manipulation}
canvas{position:fixed;inset:0;display:block;touch-action:none}
.scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.scr.on{display:flex}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:22px;width:min(720px,100%);
  max-height:100%;overflow-y:auto}
h1,h2,.pop{font-family:"Mochiy Pop One",sans-serif;font-weight:400}
h1{margin:0;line-height:1.1}
h2{margin:0 0 14px;font-size:24px}
button{font-family:"Mochiy Pop One",sans-serif;font-weight:400;color:var(--ink);border:0;cursor:pointer;touch-action:manipulation}
.btn{min-height:58px;padding:0 26px;border-radius:16px;font-size:20px;background:var(--sun);border:3px solid var(--ink);
  box-shadow:0 6px 0 var(--ink);transition:transform .06s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.sub{background:var(--paper)}
.btn.go{background:var(--pink);color:#fff;font-size:24px;min-height:66px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.small{min-height:46px;font-size:16px;padding:0 16px;box-shadow:0 4px 0 var(--ink)}
.btn.small:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center}

/* タイトル */
#scrTitle{flex-direction:column;text-align:center;gap:22px}
.logo{font-size:clamp(46px,11vw,100px);color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;
  text-shadow:0 7px 0 var(--ink);letter-spacing:.02em;animation:bob 1.1s ease-in-out infinite}
.logo span:nth-child(1){color:var(--pink)} .logo span:nth-child(2){color:var(--sun)} .logo span:nth-child(3){color:var(--mint)}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1deg)}}
.tag{font-family:"Mochiy Pop One",sans-serif;font-size:20px;color:var(--ink);-webkit-text-stroke:5px #fff;paint-order:stroke fill}

/* きょくえらび */
.songs{display:grid;gap:10px;margin-bottom:16px}
.song{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:14px;background:var(--cream);
  border:3px solid var(--ink);text-align:left;width:100%;box-shadow:0 4px 0 var(--ink)}
.song.on{background:var(--c);color:#fff}
.song.on .s{color:rgba(255,255,255,.92)}
.song .dot{width:44px;height:44px;border-radius:12px;background:var(--c);flex:none;display:grid;place-items:center;
  font-size:22px;color:#fff}
.song.on .dot{background:#fff;color:var(--c)}
.song .t{font-size:18px}
.song .s{font-family:"M PLUS 1p",sans-serif;font-size:13px;color:var(--sub);font-weight:800}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.lv{border-radius:14px;padding:9px 4px;background:var(--paper);border:3px solid var(--ink);font-size:16px;line-height:1.35;box-shadow:0 4px 0 var(--ink)}
.lv.on{background:var(--sun)}
.lv .st{color:var(--orange);font-size:15px;letter-spacing:1px}
.lv.on .st{color:var(--ink)}
.lv.lock{background:#e6e9f0;color:#9aa3b8;box-shadow:none;border-color:#c3c9d6}
.lv .need{font-family:"M PLUS 1p",sans-serif;font-size:12px;font-weight:800}
.opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:16px;font-weight:800}
.opt{display:flex;align-items:center;gap:8px;padding:2px 0}
.opt b{min-width:28px;text-align:center;font-size:20px}
.pm{width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid var(--ink);font-size:20px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.stars{font-family:"Mochiy Pop One",sans-serif;color:var(--orange);font-size:20px}
.ver{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:var(--ink);opacity:.6;font-weight:800}
.hint{color:var(--sub);font-size:13px;text-align:center;margin:-4px 0 14px;font-weight:800}

/* ずれちょうせい */
#scrCalib .panel{text-align:center}
.calCircle{width:170px;height:170px;border-radius:50%;margin:18px auto;border:5px solid var(--ink);background:var(--sun);display:grid;place-items:center;
  font-family:"Mochiy Pop One",sans-serif;font-size:22px;box-shadow:0 7px 0 var(--ink)}
.calCircle.beat{animation:beat .25s ease-out}
@keyframes beat{0%{transform:scale(1.15);background:var(--pink);color:#fff}100%{transform:scale(1)}}
.dots{display:flex;gap:8px;justify-content:center;margin:8px 0 14px}
.dots i{width:18px;height:18px;border-radius:50%;background:#e6e9f0;border:2px solid var(--ink)}
.dots i.on{background:var(--mint)}
.big{font-family:"Mochiy Pop One",sans-serif;font-size:19px;margin:6px 0}
.subt{color:var(--sub);font-weight:800;margin:6px 0 14px}

/* あそんでいる時 */
#btnPause,#btnGear{position:fixed;top:10px;right:10px;width:54px;height:54px;border-radius:50%;background:#fff;
  border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:20px;display:none;z-index:5;padding:0}
#btnPause.on,#btnGear.on{display:grid;place-items:center}
#btnGear svg{width:28px;height:28px}
#scrSettings .panel,#scrPause .panel,#scrResult .panel,#scrLimit .panel{text-align:center;width:min(480px,100%)}
#scrPause .row{flex-direction:column}
#scrPause .btn{width:100%}

/* けっか */
.rank{font-family:"Mochiy Pop One",sans-serif;font-size:110px;line-height:1;margin:4px 0;color:var(--sun);
  -webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:scale(1);opacity:1}}
.score{font-family:"Mochiy Pop One",sans-serif;font-size:38px}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0}
.counts div{background:var(--cream);border-radius:12px;padding:6px 2px;font-family:"Mochiy Pop One",sans-serif;font-size:20px}
.counts small{display:block;font-size:12px}
.resStars{font-size:46px;color:var(--sun);letter-spacing:6px;margin:4px 0;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.resStars span{display:inline-block;color:#e6e9f0}
.resStars span.on{color:var(--sun);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.fs{color:var(--sub);font-weight:800;margin-bottom:6px}
.newmsg{color:var(--pink);font-family:"Mochiy Pop One",sans-serif;min-height:1.4em;margin:6px 0 12px}
@media (max-width:760px){ #scrSelect{padding-top:76px;align-items:flex-start} }
@media (max-width:520px){ .levels{grid-template-columns:repeat(2,1fr)} .panel{padding:16px} .song{padding:7px 10px} .song .dot{width:36px;height:36px;font-size:18px} .song .t{font-size:16px} .songs{gap:8px;margin-bottom:12px} .levels{margin-bottom:12px} .lv{padding:6px 4px} .opts{gap:6px;margin-bottom:12px} .opt{font-size:14px} h2{font-size:20px} .rank{font-size:84px} }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="btnPause" aria-label="ひとやすみ">❚❚</button>
<button id="btnGear" class="on" aria-label="せってい"><svg viewBox="0 0 24 24" fill="#1f2a44"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>

<!-- タイトル -->
<section class="scr on" id="scrTitle">
  <h1 class="logo"><span>ピ</span><span>タ</span><span>ッ</span>とビート</h1>
  <div class="tag">おとに あわせて ピタッ！</div>
  <button class="btn go" id="btnPlay">あそぶ</button>
  <div class="ver" id="verLine"></div>
</section>

<!-- きょくえらび -->
<section class="scr" id="scrSelect">
  <div class="panel">
    <div class="head"><h2 style="margin:0">きょくを えらぼう</h2><div class="stars" id="starTotal">★ 0</div></div>
    <div class="songs" id="songList"></div>
    <div class="levels" id="lvList"></div>
    <div class="opts">
      <div class="opt">はやさ <button class="pm" id="spdDown">−</button><b id="spdVal">5</b><button class="pm" id="spdUp">＋</button></div>
      <div class="opt">おてほんの おと <button class="btn small sub" id="guideSnd">ON</button></div>
      <div class="opt">たたく おと <button class="btn small sub" id="tapSnd">ON</button></div>
    </div>
    <div class="hint">おとが きこえないときは：マナーモードを きる／おとを おおきくする</div>
    <div class="row">
      <button class="btn sub small" id="btnBack">もどる</button>
      <button class="btn go" id="btnStart">スタート</button>
    </div>
  </div>
</section>

<!-- ずれちょうせい -->
<section class="scr" id="scrCalib">
  <div class="panel">
    <h2>ずれ ちょうせい</h2>
    <div class="subt" id="calMsg">「ポン」の おとに あわせて がめんを タップしてね。<br>めではなく、みみで あわせるのが コツ！</div>
    <div class="calCircle" id="calCircle">タップ！</div>
    <div class="dots" id="calDots"></div>
    <div id="calResult" hidden>
      <div class="big" id="calVal"></div>
      <div class="row" style="margin:10px 0 16px">
        <button class="btn sub small" id="calMinus">はやく −</button>
        <button class="btn sub small" id="calPlus">おそく ＋</button>
      </div>
      <div class="row">
        <button class="btn sub small" id="calAgain">もういちど</button>
        <button class="btn go" id="calOk">OK</button>
      </div>
    </div>
  </div>
</section>

<!-- せってい -->
<section class="scr" id="scrSettings">
  <div class="panel">
    <h2>せってい</h2>
    <div class="big" id="setOffset"></div>
    <div class="subt">おとと タップが ずれると おもったら、もういちど はかろう</div>
    <div class="row" style="flex-direction:column">
      <button class="btn go" id="btnCal">ずれ ちょうせい</button>
      <button class="btn sub small" id="btnSetBack">もどる</button>
    </div>
  </div>
</section>

<!-- ひとやすみ -->
<section class="scr" id="scrPause">
  <div class="panel">
    <h2>ひとやすみ</h2>
    <div class="row">
      <button class="btn go" id="btnResume">つづける</button>
      <button class="btn sub" id="btnRetry">さいしょから</button>
      <button class="btn sub" id="btnQuit">やめる</button>
    </div>
  </div>
</section>

<!-- けっか -->
<section class="scr" id="scrResult">
  <div class="panel">
    <div class="fs" id="resSong"></div>
    <div class="rank" id="resRank">S</div>
    <div class="resStars" id="resStars"><span>★</span><span>★</span><span>★</span></div>
    <div class="score" id="resScore">0</div>
    <div class="counts">
      <div style="color:var(--gold)"><small>ピタッ！</small><span id="cP">0</span></div>
      <div style="color:var(--cyan)"><small>ナイス！</small><span id="cN">0</span></div>
      <div style="color:var(--pink)"><small>おしい！</small><span id="cO">0</span></div>
      <div style="color:#8a8fb0"><small>ミス</small><span id="cM">0</span></div>
    </div>
    <div class="fs" id="resCombo"></div>
    <div class="newmsg" id="resNew"></div>
    <div class="row">
      <button class="btn sub" id="btnAgain">もういちど</button>
      <button class="btn go" id="btnToSelect">きょくを えらぶ</button>
    </div>
  </div>
</section>

<!-- 1日の時間おわり（いまはOFF） -->
<section class="scr" id="scrLimit">
  <div class="panel">
    <h2>きょうは ここまで！</h2>
    <div class="big">また あしたね 🌙</div>
    <div class="subt">あしたも ピタッと あわせよう</div>
  </div>
</section>

<script>
'use strict';
/* =========================================================
   ピタッとビート
   中身は役割ごとに分けてある:
   [設定] [記録] [1日の時間] [音] [曲] [譜面] [判定] [演出] [画面]
   ========================================================= */

/* ===== [設定] 判定の幅（秒）。大人向けの音ゲーと同じくらい ===== */
const JUDGE = { p: 0.040, n: 0.080, o: 0.120 };
const JUDGE_INFO = {
  p: { text: 'ピタッ！', color: '#ffd84a', w: 1.0 },
  n: { text: 'ナイス！', color: '#4ef0ff', w: 0.8 },
  o: { text: 'おしい！', color: '#ff8fc4', w: 0.5 },
  m: { text: 'ミス',     color: '#b4b8d8', w: 0 }
};
const LANES = 4;
const LANE_INFO = [
  { color: '#ff4d7e', shape: 'circle'   },
  { color: '#4da3ff', shape: 'triangle' },
  { color: '#3ddc84', shape: 'square'   },
  { color: '#ffd23f', shape: 'star'     }
];
const KEYMAP = { d: 0, f: 1, j: 2, k: 3, arrowleft: 0, arrowdown: 1, arrowup: 2, arrowright: 3 };
// need = この数の★があつまると ひらく
const LEVELS = [
  { name: 'かんたん',   need: 0  },
  { name: 'ふつう',     need: 1  },
  { name: 'むずかしい', need: 4  },
  { name: 'おに',       need: 8  }
];
// C 以上で クリア（★1）。A で ★2、S で ★3
const RANKS = [ ['SS', 990000, 3], ['S', 950000, 3], ['A', 880000, 2], ['B', 760000, 1], ['C', 600000, 1], ['D', 0, 0] ];
const VERSION = 'v10';
const RANK_COLORS = { SS: '#ff5c8a', S: '#ffc61a', A: '#ff8a3d', B: '#22c97f', C: '#3d8bff', D: '#9aa3b8' };
const AUTO = /[?&]auto/.test(location.search); // おてほん（テスト用・記録は別の箱）

/* ===== [記録] この端末の中だけに保存（外には送らない） ===== */
const Save = {
  key: AUTO ? 'pitatto-beat-auto' : 'pitatto-beat-v1', data: null,
  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(this.key)); } catch (e) {}
    this.data = Object.assign({ offset: null, speed: 5, tapSound: true, guide: true, records: {}, play: { date: '', sec: 0 }, sel: { song: 0, lv: 0 }, unlockAll: false }, d || {});
  },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) {} },
  rec(song, lv) { const r = this.data.records[song]; return r ? (r[lv] || null) : null; },
  setRec(song, lv, r) { if (!this.data.records[song]) this.data.records[song] = {}; this.data.records[song][lv] = r; this.save(); },
  totalStars() { let s = 0; const R = this.data.records; for (const a in R) for (const b in R[a]) s += R[a][b].stars || 0; return s; }
};
Save.load();

/* ===== [1日の時間] いまはOFF。enabled を true にすると 1日 dailySec 秒まで ===== */
const PlayLimit = {
  enabled: false,
  dailySec: 600,
  today() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); },
  used() { const p = Save.data.play; return p.date === this.today() ? p.sec : 0; },
  add(sec) { const p = Save.data.play, t = this.today(); if (p.date !== t) { p.date = t; p.sec = 0; } p.sec += sec; },
  canPlay() { return !this.enabled || this.used() < this.dailySec; }
};

/* ===== [音] Web Audio。ゲームの時計は「音の時計」ひとつに揃える ===== */
let actx = null, master = null, noiseBuf = null;
function unlockAudio() {
  // iPhone はマナーモードのとき鳴らさない（スピーカーがオンのときだけ鳴る）
  try { if (navigator.audioSession) navigator.audioSession.type = 'ambient'; } catch (e) {}
  if (actx && actx.state !== 'running') { const pr = actx.resume(); if (pr && pr.catch) pr.catch(() => {}); }
}
// 画面のどこを触っても、止まっていた音を起こす
['pointerdown', 'touchend', 'keydown'].forEach(ev => window.addEventListener(ev, () => { if (actx && actx.state !== 'running' && !G.paused) unlockAudio(); }, true));
function chime() {
  const t = actx.currentTime + 0.02;
  [76, 79, 84].forEach((m, i) => tone(master, t + i * 0.09, m, 0.18, 'triangle', 0.25, 4000));
}
function initAudio() {
  unlockAudio();
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  try { actx = new AC({ latencyHint: 'interactive' }); } catch (e) { actx = new AC(); }
  unlockAudio();
  const comp = actx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.15;
  master = actx.createGain(); master.gain.value = 0.85;
  master.connect(comp); comp.connect(actx.destination);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
// いま スピーカーから出ている音の時刻
function audioNow() {
  if (!actx) return 0;
  if (actx.state === 'running' && actx.getOutputTimestamp) {
    const o = actx.getOutputTimestamp();
    if (o && o.contextTime > 0 && o.performanceTime > 0) {
      const lag = (performance.now() - o.performanceTime) / 1000;
      if (lag >= 0 && lag < 0.1) return o.contextTime + lag;
    }
  }
  return actx.currentTime - (actx.outputLatency || actx.baseLatency || 0);
}
// 指が触れた瞬間を音の時計に直す
function eventAudioTime(e) {
  const now = audioNow();
  if (e && e.timeStamp) {
    const lag = (performance.now() - e.timeStamp) / 1000;
    if (lag >= 0 && lag < 0.15) return now - lag;
  }
  return now;
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

function tone(dest, t, m, dur, wave, vol, cut, att, det) {
  att = att || 0.005;
  const o = actx.createOscillator(); o.type = wave; o.frequency.value = mtof(m); if (det) o.detune.value = det;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cut;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + att);
  g.gain.setTargetAtTime(vol * 0.55, t + att, dur * 0.4);
  g.gain.setTargetAtTime(0.0001, t + dur, 0.04);
  o.connect(f); f.connect(g); g.connect(dest);
  o.start(t); o.stop(t + dur + 0.3);
}
function noise(dest, t, dur, type, freq, vol, q) {
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq; if (q) f.Q.value = q;
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(dest);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
function kick(dest, t, vol) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.13);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.35);
}
function click(t, accent) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.frequency.value = accent ? 2000 : 1500;

      const p = k / 0.4;
      cx.strokeStyle = hexA(e.col, 1 - p); cx.lineWidth = 6 * (1 - p) + 1;
      cx.beginPath(); cx.arc(e.x, e.y, laneW * 0.22 + laneW * 0.32 * e.big * (1 - Math.pow(1 - p, 3)), 0, Math.PI * 2); cx.stroke();
    } else {
      if (k > e.life) { effects.splice(i, 1); continue; }
      const p = k / e.life;
      cx.fillStyle = hexA(e.col, 1 - p);
      const x = e.x + e.vx * k, y = e.y + e.vy * k + 400 * k * k;
      cx.fillRect(x - e.size / 2, y - e.size / 2, e.size, e.size);
    }
  }
  cx.globalCompositeOperation = 'source-over';
}
const hexCache = {};
function hexA(hex, a) {
  let rgb = hexCache[hex];
  if (!rgb) { const n = parseInt(hex.slice(1), 16); rgb = hexCache[hex] = ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255); }
  return 'rgba(' + rgb + ',' + Math.max(0, Math.min(1, a)).toFixed(3) + ')';
}

let lastT = now();
function loop() {
  const t = now(), dt = Math.min(0.1, t - lastT); lastT = t;
  for (const c of clouds) { c.x += dt * c.v; if (c.x > 1) c.x -= 1; }
  for (const f of floaters) { f.y -= dt * f.vy; f.rot += dt * f.vr; if (f.y < -0.05) { f.y = 1.05; f.x = Math.random(); } }
  for (let l = 0; l < LANES; l++) G.flash[l] = Math.max(0, G.flash[l] - dt * 5);
  G.flashLine = Math.max(0, (G.flashLine || 0) - dt * 6);
  if (Cal.active) calTick();
  if (G.state === 'play') {
    if (!G.paused) updatePlay(dt);
    if (G.state === 'play') drawPlay(t);
  } else {
    drawBackground(t, 0);
  }
  requestAnimationFrame(loop);
}

/* ===== ずれ ちょうせい（その端末の音と指の遅れを測る） ===== */
const Cal = { active: false, beats: [], n: 0, startAt: 0, interval: 0.6, max: 26, need: 10, taps: [], shown: 0, returnTo: 'scrSelect' };
function calStart(returnTo) {
  initAudio();
  Cal.returnTo = returnTo || 'scrSelect';
  Cal.taps = []; Cal.beats = []; Cal.n = 0; Cal.shown = 0;
  Cal.startAt = actx.currentTime + 1.0; Cal.active = true;
  $('calResult').hidden = true; $('calCircle').hidden = false; $('calDots').hidden = false;
  $('calMsg').innerHTML = '「ポン」の おとに あわせて がめんを タップしてね。<br>めではなく、みみで あわせるのが コツ！';
  calDots();
  show('scrCalib');
}
function calDots() {
  const d = $('calDots'); d.innerHTML = '';
  for (let i = 0; i < Cal.need; i++) { const e = document.createElement('i'); if (i < Cal.taps.length) e.className = 'on'; d.appendChild(e); }
}
function calTick() {
  while (Cal.n < Cal.max && Cal.startAt + Cal.n * Cal.interval < actx.currentTime + 0.2) {
    const t = Cal.startAt + Cal.n * Cal.interval; Cal.beats.push(t); click(t, Cal.n % 4 === 0); Cal.n++;
  }
  const an = audioNow();
  while (Cal.shown < Cal.beats.length && an >= Cal.beats[Cal.shown]) {
    const c = $('calCircle'); c.classList.remove('beat'); void c.offsetWidth; c.classList.add('beat'); Cal.shown++;
  }
  if (Cal.n >= Cal.max && an > Cal.beats[Cal.beats.length - 1] + 0.8) calFinish();
}
function calTap(e) {
  if (!Cal.active) return;
  const t = eventAudioTime(e);
  let bd = 9;
  Cal.beats.forEach(b => { const d = t - b; if (Math.abs(d) < Math.abs(bd)) bd = d; });
  if (Math.abs(bd) < 0.3) { Cal.taps.push(bd); calDots(); }
  if (Cal.taps.length >= Cal.need) calFinish();
}
function calFinish() {
  Cal.active = false;
  $('calCircle').hidden = true; $('calDots').hidden = true;
  if (Cal.taps.length >= 6) {
    const v = Cal.taps.slice(2).sort((a, b) => a - b);
    Save.data.offset = Math.round(v[Math.floor(v.length / 2)] * 1000) / 1000;
    Save.save();
    $('calMsg').textContent = 'なおしたよ！ この タブレットに あわせました。';
  } else {
    if (Save.data.offset == null) { Save.data.offset = 0; Save.save(); }
    $('calMsg').textContent = 'タップが すくなかったみたい。もういちど やってみよう。';
  }
  calShowVal();
  $('calResult').hidden = false;
}
function calShowVal() {
  const v = Save.data.offset || 0;
  $('calVal').textContent = 'ずれ： ' + (v >= 0 ? '+' : '') + v.toFixed(3) + ' びょう';
}

/* ===== [画面] ===== */
function $(id) { return document.getElementById(id); }
let lastMenu = 'scrTitle';
function show(id) {
  document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id === id));
  if (id === 'scrTitle' || id === 'scrSelect') lastMenu = id;
  $('btnGear').classList.toggle('on', id === 'scrTitle' || id === 'scrSelect');
}
function renderSelect() {
  const total = Save.totalStars();
  $('starTotal').textContent = '★ ' + total;
  const sl = $('songList'); sl.innerHTML = '';
  SONGS.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'song' + (i === G.songIdx ? ' on' : '');
    b.style.setProperty('--c', s.color);
    let st = 0; LEVELS.forEach((L, lv) => { const r = Save.rec(s.id, lv); if (r) st += r.stars; });
    b.innerHTML = '<span class="dot">' + s.icon + '</span><span><div class="t">' + s.title + '</div><div class="s">' + s.sub + '　BPM ' + s.bpm + '　★' + st + '</div></span>';
    b.onclick = () => { G.songIdx = i; Save.data.sel.song = i; Save.save(); renderSelect(); };
    sl.appendChild(b);
  });
  const ll = $('lvList'); ll.innerHTML = '';
  const song = SONGS[G.songIdx];
  LEVELS.forEach((L, lv) => {
    const open = Save.data.unlockAll || total >= L.need;
    const r = Save.rec(song.id, lv), n = r ? r.stars : 0;
    const b = document.createElement('button');
    b.className = 'lv' + (lv === G.lv ? ' on' : '') + (open ? '' : ' lock');
    b.innerHTML = '<div>' + (open ? '' : '🔒 ') + L.name + '</div>' +
      (open ? '<div class="st">' + '★'.repeat(n) + '☆'.repeat(3 - n) + '</div>' + (r ? '<div class="need">' + r.score.toLocaleString() + (r.fc ? ' FC' : '') + '</div>' : '')
            : '<div class="need">★' + L.need + 'で ひらく</div>');
    b.onclick = () => { if (!open) return; G.lv = lv; Save.data.sel.lv = lv; Save.save(); renderSelect(); };
    ll.appendChild(b);
  });
  if (!(Save.data.unlockAll || total >= LEVELS[G.lv].need)) G.lv = 0;
  $('spdVal').textContent = Save.data.speed;
  $('tapSnd').textContent = Save.data.tapSound ? 'ON' : 'OFF';
  $('guideSnd').textContent = Save.data.guide ? 'ON' : 'OFF';
}
G.songIdx = Math.min(Save.data.sel.song || 0, SONGS.length - 1);
G.lv = Save.data.sel.lv || 0;

function goFull() {
  const d = document.documentElement;
  try { if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(() => {}); } catch (e) {}
}
// はじめての時は、曲えらびの前に ずれ ちょうせい
$('btnPlay').onclick = () => { initAudio(); chime(); goFull(); if (Save.data.offset == null && !AUTO) { calStart('scrSelect'); return; } renderSelect(); show('scrSelect'); };
$('btnBack').onclick = () => show('scrTitle');
function renderSettings() { const v = Save.data.offset || 0; $('setOffset').textContent = 'いまの ずれ： ' + (v >= 0 ? '+' : '') + v.toFixed(3) + ' びょう'; }
$('btnGear').onclick = () => { renderSettings(); show('scrSettings'); };
$('btnSetBack').onclick = () => { if (lastMenu === 'scrSelect') renderSelect(); show(lastMenu); };
$('btnCal').onclick = () => calStart('scrSettings');
$('btnStart').onclick = () => {
  initAudio();
  if (Save.data.offset == null && !AUTO) { calStart('start'); return; }
  startSong();
};
$('spdDown').onclick = () => { Save.data.speed = Math.max(1, Save.data.speed - 1); Save.save(); renderSelect(); };
$('spdUp').onclick = () => { Save.data.speed = Math.min(10, Save.data.speed + 1); Save.save(); renderSelect(); };
$('tapSnd').onclick = () => { Save.data.tapSound = !Save.data.tapSound; Save.save(); renderSelect(); };
$('guideSnd').onclick = () => { Save.data.guide = !Save.data.guide; Save.save(); renderSelect(); };
$('calCircle').addEventListener('pointerdown', calTap);
$('scrCalib').addEventListener('pointerdown', e => { if (e.target.closest('button') || e.target.id === 'calCircle') return; calTap(e); });
$('calMinus').onclick = () => { Save.data.offset = Math.round(((Save.data.offset || 0) - 0.01) * 1000) / 1000; Save.save(); calShowVal(); };
$('calPlus').onclick = () => { Save.data.offset = Math.round(((Save.data.offset || 0) + 0.01) * 1000) / 1000; Save.save(); calShowVal(); };
$('calAgain').onclick = () => calStart(Cal.returnTo);
$('calOk').onclick = () => { if (Cal.returnTo === 'start') startSong(); else if (Cal.returnTo === 'scrSettings') { renderSettings(); show('scrSettings'); } else { renderSelect(); show('scrSelect'); } };
$('btnPause').onclick = pauseGame;
$('btnResume').onclick = resumeGame;
$('btnRetry').onclick = () => { quitSong(); startSong(); };
$('btnQuit').onclick = () => { quitSong(); renderSelect(); show('scrSelect'); };
$('btnAgain').onclick = () => startSong();
$('btnToSelect').onclick = () => { G.state = 'menu'; renderSelect(); show('scrSelect'); };

// タッチ：レーンの上なら どこを触っても反応する
const pointerLane = {};
function laneAt(x) { return Math.max(0, Math.min(LANES - 1, Math.floor((x - playX) / laneW))); }
cv.addEventListener('pointerdown', e => {
  if (G.state !== 'play') return;
  e.preventDefault();
  const l = laneAt(e.clientX); pointerLane[e.pointerId] = l; press(l, e);
});
function pointerEnd(e) { const l = pointerLane[e.pointerId]; if (l === undefined) return; delete pointerLane[e.pointerId]; release(l, e); }
cv.addEventListener('pointerup', pointerEnd);
cv.addEventListener('pointercancel', pointerEnd);
cv.addEventListener('contextmenu', e => e.preventDefault());
// キーボード：D F J K ／ ← ↓ ↑ →
const keyDown = {};
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'escape' && G.state === 'play') { pauseGame(); return; }
  if (!(k in KEYMAP)) return;
  e.preventDefault();
  if (keyDown[k]) return; keyDown[k] = true;
  if (Cal.active) { calTap(e); return; }
  press(KEYMAP[k], e);
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (!(k in KEYMAP)) return;
  keyDown[k] = false;
  if (!Cal.active) release(KEYMAP[k], e);
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (AUTO) { G.lv = Math.min(3, parseInt((location.search.match(/lv=(\d)/) || [0, 0])[1], 10)); Save.data.unlockAll = true; }
function showVer() {
  const st = actx ? actx.state : 'まだ';
  $('verLine').textContent = VERSION + '　おと：' + (st === 'running' ? 'OK' : st);
}
showVer(); setInterval(showVer, 1000);
requestAnimationFrame(loop);
</script>
